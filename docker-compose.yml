services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]

  server:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/resqpaws
      JWT_SECRET: ${JWT_SECRET:-please-change-me-before-deploying}
      CLIENT_ORIGIN: http://localhost:8080
      CONFIDENCE_THRESHOLD: 0.35
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes: [uploads-data:/app/uploads]
    ports: ["5000:5000"]

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  mongo-data:
  uploads-data:
